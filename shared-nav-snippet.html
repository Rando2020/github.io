<style>
.orivo-nav{
  position:sticky;top:0;z-index:100;
  background:rgba(5,10,20,.95);backdrop-filter:blur(18px);

.orivo-nav-brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.orivo-nav-logo{font-family:'DM Serif Display','Palatino Linotype',Palatino,Georgia,serif;font-size:19px;color:#00C896;letter-spacing:-.4px}

.orivo-nav-crumb{font-size:12px;color:rgba(240,242,255,.35);display:flex;align-items:center;gap:7px}

.orivo-nav-home:hover{color:rgba(240,242,255,.85);border-color:rgba(240,242,255,.16)}
.orivo-nav-book{font-size:12px;font-weight:600;color:#030C0A;background:#00C896;padding:7px 15px;border-radius:7px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.orivo-nav-book:hover{background:#009E75}
@media(max-width:700px){
  .orivo-nav{padding:0 16px}
  .orivo-nav-crumb{display:none}
}

<script>
function sharedSendNote(){
  const v=document.getElementById('sharedEmail').value.trim();
  if(!v||!v.includes('@'))return;
  document.getElementById('sharedEmailOk').style.display='block';
  document.getElementById('sharedEmail').disabled=true;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('orivoBookModal').style.display='none'});
</script>
