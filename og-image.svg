<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#050A14"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00C896" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <radialGradient id="glow" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00C896" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050A14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Decorative rings -->
  <circle cx="900" cy="200" r="280" fill="none" stroke="#00C896" stroke-width="1" opacity="0.06"/>
  <circle cx="900" cy="200" r="180" fill="none" stroke="#00C896" stroke-width="0.8" opacity="0.05"/>
  <!-- Logo -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="72" fill="#00C896" letter-spacing="-2">orivo</text>
  <text x="80" y="235" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="rgba(240,242,255,0.35)" letter-spacing="5">HEALTH</text>
  <!-- Divider -->
  <rect x="80" y="268" width="60" height="2" fill="#00C896" rx="1"/>
  <!-- Headline -->
  <text x="80" y="340" font-family="Georgia, serif" font-size="52" fill="#F0F2FF" letter-spacing="-1">Epic helps providers.</text>
  <text x="80" y="410" font-family="Georgia, serif" font-size="52" fill="#00C896" letter-spacing="-1">Orivo helps patients.</text>
  <!-- Sub -->
  <text x="80" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="rgba(240,242,255,0.6)">Any phone. Any language. No app required.</text>
  <!-- Pills row -->
  <rect x="80" y="510" width="130" height="36" rx="18" fill="rgba(0,200,150,0.1)" stroke="#00C896" stroke-width="1" opacity="0.6"/>
  <text x="145" y="533" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#00C896" text-anchor="middle">SMS-native</text>
  <rect x="224" y="510" width="140" height="36" rx="18" fill="rgba(0,200,150,0.1)" stroke="#00C896" stroke-width="1" opacity="0.6"/>
  <text x="294" y="533" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#00C896" text-anchor="middle">40+ languages</text>
  <rect x="378" y="510" width="160" height="36" rx="18" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="1" opacity="0.6"/>
  <text x="458" y="533" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#F5A623" text-anchor="middle">HIPAA-aligned</text>
  <!-- Domain -->
  <text x="1120" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(240,242,255,0.3)" text-anchor="end">orivohealth.com</text>
</svg>
